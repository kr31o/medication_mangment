<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b7d57">
  <title>الرئيسية · منصة الأدوية</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
  <script type="module" src="/js/patient/index.js"></script>
</head>
<body class="is-loading">
  <main class="page">
    <div class="hero">
      <div>
        <h1 id="greeting">أهلًا بك</h1>
        <p>هذا ملخص يومك.</p>
      </div>
      <a class="btn btn--light btn--lg" href="/patient/search"><i data-icon="search" data-size="19"></i>ابحث عن دواء</a>
      <span class="floaty" style="--w: 110px; --a: #ffc857; --tilt: -28deg; --t: 8s; top: -18px; left: 34%"></span>
      <span class="floaty" style="--w: 70px; --a: #8ec9ff; --tilt: 24deg; --t: 6.5s; --d: -2s; bottom: -14px; left: 52%"></span>
    </div>

    <!-- تنبيهات: الملف الشخصي غير مكتمل، أو دواء على وشك النفاد -->
    <div id="alerts" class="stack stack--sm section" hidden></div>

    <div id="stats" class="grid grid--3 grid--stats section"></div>

    <div class="split">
      <section class="section">
        <div class="section__head">
          <h2>جرعات اليوم</h2>
          <a class="btn btn--ghost btn--sm" href="/patient/doses">الكل</a>
        </div>
        <div class="card"><div class="card__body" id="doses"></div></div>
      </section>

      <div>
        <section class="section">
          <div class="section__head">
            <h2>طلباتي الجارية</h2>
            <a class="btn btn--ghost btn--sm" href="/patient/orders">الكل</a>
          </div>
          <div class="card" id="orders"></div>
        </section>

        <section class="section" id="insight" hidden>
          <div class="section__head">
            <h2>آخر ملخص</h2>
            <a class="btn btn--ghost btn--sm" href="/patient/insights">الكل</a>
          </div>
          <div class="card insight">
            <div class="card__body">
              <div class="result" style="margin-bottom: 10px">
                <span class="tile tile--violet"><i data-icon="sparkles" data-size="20"></i></span>
                <span class="semi" id="insight-title"></span>
              </div>
              <p class="insight__text" id="insight-text"></p>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>
</body>
</html>

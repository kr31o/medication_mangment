<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b7d57">
  <title>البحث عن دواء · منصة الأدوية</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="/js/patient/search.js"></script>
</head>
<body class="is-loading">
  <main class="page">
    <header class="page-head">
      <div>
        <h1>البحث عن دواء</h1>
        <div class="page-head__sub">ابحث عن دوائك، فنعرض الصيدليات القريبة من موقعك التي يتوفر فيها بالكمية التي تحتاجها</div>
      </div>
    </header>
    <div id="profile-alert" class="section" hidden></div>

    <!-- الخطوة 1: اختيار الدواء من الكتالوج، بالاسم أو بالتصنيف -->
    <div class="card" id="catalog">
      <div class="search-box stack">
        <div class="field">
          <div class="field__control field__control--icon">
            <span class="field__icon"><i data-icon="search" data-size="22"></i></span>
            <input id="q" class="input input--hero" aria-label="اسم الدواء" placeholder="اسم الدواء التجاري أو العلمي، مثل Panadol أو Paracetamol" autocomplete="off" autofocus>
          </div>
        </div>
        <div id="chips"></div>
      </div>
      <div id="results"></div>
    </div>

    <!-- الخطوة 2: الصيدليات القريبة التي يتوفر فيها الدواء المختار، قائمة وخريطة -->
    <div class="split split--even" id="nearby" hidden>
      <div class="stack">
        <div class="card">
          <div class="card__body stack">
            <div class="between" style="align-items: flex-start">
              <div class="result">
                <span class="tile"><i data-icon="pill" data-size="20"></i></span>
                <div>
                  <h3 id="medication-name"></h3>
                  <div class="small muted" id="medication-meta"></div>
                </div>
              </div>
              <button type="button" class="btn btn--soft btn--sm" id="change">تغيير</button>
            </div>
            <div id="whereami"></div>
            <div class="grid grid--2 grid--keep">
              <div id="quantity"></div>
              <div class="field">
                <label class="field__label" for="radius">نطاق البحث</label>
                <select id="radius" class="input">
                  <option value="2">2 كم</option>
                  <option value="5">5 كم</option>
                  <option value="10" selected>10 كم</option>
                  <option value="25">25 كم</option>
                  <option value="50">50 كم</option>
                </select>
              </div>
            </div>
          </div>
        </div>
        <div id="pharmacies" class="stack"></div>
        <!-- [قرار المستخدم] بدائل الدواء بنفس التركيبة، ومع كل بديل أقرب صيدليات فيها -->
        <div id="alternatives"></div>
      </div>
      <div>
        <div class="card map-card"><div id="map"></div></div>
        <p class="tiny muted" style="margin-top: 8px" id="map-note"></p>
      </div>
    </div>
  </main>
</body>
</html>

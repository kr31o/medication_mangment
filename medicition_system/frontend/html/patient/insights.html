<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b7d57">
  <title>ملخصات الالتزام · منصة الأدوية</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
  <script type="module" src="/js/patient/insights.js"></script>
</head>
<body class="is-loading">
  <main class="page">
    <header class="page-head">
      <div>
        <h1>ملخصات الالتزام</h1>
        <div class="page-head__sub">قراءة لأرقام التزامك بالجرعات. يصلك ملخص تلقائي كل أسبوع.</div>
      </div>
      <div class="page-head__actions">
        <button type="button" class="btn btn--primary" id="generate"><i data-icon="sparkles"></i>ملخص الآن</button>
      </div>
    </header>
    <div class="stack">
      <div class="alert alert--note" role="status">
        <span class="alert__icon"><i data-icon="info"></i></span>
        <div class="alert__body">هذه الملخصات تصف التزامك بالأرقام فقط. ليست تشخيصًا ولا نصيحة علاجية، ولا تغني عن طبيبك أو الصيدلي.</div>
      </div>
      <div class="alert alert--info" role="status" id="writing" hidden>
        <span class="alert__icon"><i data-icon="info"></i></span>
        <div class="alert__body">النموذج اللغوي يكتب ملخصك على هذا الجهاز، وقد يأخذ ذلك حتى دقيقة. إن لم يكن متاحًا يُكتب الملخص بالقالب الثابت.</div>
      </div>
      <div id="generate-error" hidden></div>
      <div id="list" class="stack"></div>
    </div>
  </main>
</body>
</html>

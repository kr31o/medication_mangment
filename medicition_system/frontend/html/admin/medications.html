<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b7d57">
  <title>كتالوج الأدوية · منصة الأدوية</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
  <script type="module" src="/js/admin/medications.js"></script>
</head>
<body class="is-loading">
  <main class="page">
    <header class="page-head">
      <div>
        <h1>كتالوج الأدوية</h1>
        <div class="page-head__sub">تعريف الدواء وتصنيفه؛ الكميات والأسعار تخص كل صيدلية في مخزونها</div>
      </div>
      <div class="page-head__actions">
        <button type="button" class="btn btn--primary" id="add"><i data-icon="plus"></i>دواء جديد</button>
      </div>
    </header>
    <div class="card">
      <div class="toolbar">
        <div class="field">
          <div class="field__control field__control--icon">
            <span class="field__icon"><i data-icon="search"></i></span>
            <input id="q" class="input input--sm input--search" aria-label="بحث في الكتالوج" placeholder="بحث بالاسم التجاري أو العلمي أو الشركة" autocomplete="off">
          </div>
        </div>
        <div class="field">
          <select id="category" class="input input--sm" aria-label="التصنيف"></select>
        </div>
      </div>
      <div id="list"></div>
      <div id="pager"></div>
    </div>
  </main>
</body>
</html>
